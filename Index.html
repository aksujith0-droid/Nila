<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Nila — Pregnancy Companion</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nila">
<meta name="theme-color" content="#FDF6F2">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23F6CFC4'/%3E%3Ccircle cx='90' cy='90' r='54' fill='%23FFF2EA'/%3E%3Ccircle cx='82' cy='78' r='26' fill='%23F2B5A4'/%3E%3Cellipse cx='98' cy='104' rx='24' ry='30' fill='%23F2B5A4' transform='rotate(-15 98 104)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ TRIMESTER THEMES ============ */
:root{
  --ink:#3A2440; --ink-soft:#7C6886; --card:#FFFFFF;
  --good:#5F8F6E; --warn-bg:#FBF1DE; --warn-ink:#8F5E1C;
  --radius:20px;
}
body.t1{ --bg:#FAF5FB; --bg2:#F2E8F4; --accent:#A86BC9; --accent-deep:#8A4FAE; --line:#EBDDF0;
  --orb1:#F2E3F6; --orb2:#E2C9EC; --orb3:#C5A3D8; --orb4:#A483BE; --orb-ink:#5A3A6E;
  --glowshadow:0 10px 30px rgba(168,107,201,.22); }
body.t2{ --bg:#FDF6F2; --bg2:#F8E9E2; --accent:#DE6E7C; --accent-deep:#C25264; --line:#F0DDD6;
  --orb1:#FBE4DC; --orb2:#F3C4BC; --orb3:#DD9CA6; --orb4:#BC7E94; --orb-ink:#5E2E44;
  --glowshadow:0 10px 30px rgba(222,110,124,.22); }
body.t3{ --bg:#F6F2F8; --bg2:#ECE4F0; --accent:#7C52A6; --accent-deep:#5F3B85; --line:#E3D8EA;
  --orb1:#56407A; --orb2:#43315F; --orb3:#322348; --orb4:#221733; --orb-ink:#F4E8FF;
  --glowshadow:0 10px 30px rgba(124,82,166,.28); }
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Albert Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  font-size:16px;line-height:1.55;overscroll-behavior:none;transition:background .6s}
h1,h2,h3,.serif{font-family:'Fraunces',serif;font-weight:500;letter-spacing:-.015em}
button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink)}
::placeholder{color:#BCA9C4}
svg.ic{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

#app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative}
.screen{flex:1;padding:14px 18px 116px;display:none;animation:fadein .28s ease}
.screen.active{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* topbar + journey progress */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) 18px 8px}
.brand{font-family:'Fraunces',serif;font-size:21px;color:var(--accent-deep);display:flex;align-items:center;gap:7px}
.brand .moon{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 65% 35%,#FFE9B8,var(--accent));box-shadow:0 0 10px rgba(217,164,65,.5)}
.weekpill{background:var(--ink);color:#fff;border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:650;letter-spacing:.02em}
.journey{height:4px;background:var(--bg2);border-radius:2px;margin:0 18px 10px;overflow:hidden}
.journey i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent-deep));transition:width 1s ease}
.iconbtn{padding:6px;color:var(--ink-soft)}

/* cards */
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 1px 2px rgba(58,36,64,.05),0 8px 24px rgba(58,36,64,.06);padding:17px 18px;margin-bottom:13px;border:1px solid var(--line)}
.card h3{font-size:17.5px;margin-bottom:7px}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:7px}
.muted{color:var(--ink-soft);font-size:13.5px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--bg2);border-radius:999px;padding:5px 12px;font-size:12.5px;margin:3px 5px 3px 0;font-weight:550}
.chip.warn{background:var(--warn-bg);color:var(--warn-ink)}
.chip.good{background:#E7F0E9;color:#3E6B4B}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;border-radius:999px;padding:13px 22px;font-weight:600;font-size:15px;box-shadow:var(--glowshadow);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--bg2);color:var(--ink);box-shadow:none}
.btn.small{padding:8px 16px;font-size:13px}
.btn.full{width:100%}
.btn:disabled{opacity:.5}

/* tab bar */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:9px 6px calc(9px + env(safe-area-inset-bottom));z-index:50}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px;color:var(--ink-soft);font-size:10.5px;font-weight:600;letter-spacing:.02em}
.tab.active{color:var(--accent-deep)}
.tab.active svg.ic{stroke-width:2.3}

/* womb scene */
.womb{position:relative;border-radius:26px;overflow:hidden;margin-bottom:13px;
  background:radial-gradient(circle at 50% 42%,var(--orb1) 0%,var(--orb2) 42%,var(--orb3) 72%,var(--orb4) 100%);
  box-shadow:var(--glowshadow);touch-action:pan-y}
.womb canvas{position:absolute;inset:0;width:100%;height:100%}
.womb .babywrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.womb svg.baby{width:72%;height:72%;filter:drop-shadow(0 8px 18px rgba(80,40,60,.25));animation:floaty 6s ease-in-out infinite;will-change:transform}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-9px) rotate(1.5deg)}}
.womb .hb{animation:heartbeat .43s ease-in-out infinite alternate}
@keyframes heartbeat{from{transform:scale(1)}to{transform:scale(1.012)}}
.orb-week{position:absolute;top:13px;left:14px;background:color-mix(in srgb,var(--card) 72%,transparent);backdrop-filter:blur(8px);border-radius:999px;padding:6px 14px;font-weight:700;font-size:12.5px;color:var(--ink);z-index:3}
.orb-caption{position:absolute;left:0;right:0;bottom:11px;text-align:center;color:var(--orb-ink);font-size:12.5px;font-weight:600;z-index:3;opacity:.85;pointer-events:none}
.portrait{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;animation:fadein .5s}
.porttoggle{position:absolute;top:13px;right:14px;z-index:5;background:color-mix(in srgb,var(--card) 75%,transparent);backdrop-filter:blur(8px);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700;color:var(--ink)}
.factbubble{position:absolute;left:50%;top:14%;transform:translateX(-50%);background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);border-radius:16px;padding:10px 15px;font-size:13px;max-width:78%;text-align:center;box-shadow:0 8px 24px rgba(40,20,40,.18);z-index:4;display:none;animation:fadein .3s}
.factbubble.show{display:block}

/* stats + quick tiles */
.statrow{display:flex;gap:10px;margin-bottom:13px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:17px;padding:11px 8px;text-align:center;box-shadow:0 1px 2px rgba(58,36,64,.05)}
.stat b{font-family:'Fraunces',serif;font-size:18px;display:block;line-height:1.25}
.stat span{font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.1em;font-weight:650}
.quickrow{display:flex;gap:10px;margin-bottom:13px}
.quick{flex:1;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 10px 11px;text-align:center;font-size:12px;font-weight:600;color:var(--ink-soft);position:relative;overflow:hidden;transition:transform .1s}
.quick:active{transform:scale(.96)}
.quick b{display:block;font-size:21px;font-family:'Fraunces',serif;color:var(--ink);margin:1px 0 2px}
.dots{display:flex;gap:5px;justify-content:center;margin-top:7px}
.dot{width:11px;height:11px;border-radius:50%;background:var(--bg2);transition:background .2s,transform .2s}
.dot.on{transform:scale(1.05)}
.dot.water.on{background:#6FA8C9}
.dot.kick.on{background:var(--accent)}
.ripple{position:absolute;border-radius:50%;background:color-mix(in srgb,var(--accent) 25%,transparent);transform:scale(0);animation:rip .5s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(3);opacity:0}}
.moodrow{display:flex;justify-content:space-between;gap:6px}
.mood{flex:1;text-align:center;font-size:25px;padding:8px 0;border-radius:14px;border:1.5px solid transparent;filter:grayscale(.55);transition:all .15s}
.mood.sel{filter:none;border-color:var(--accent);background:var(--bg2);transform:scale(1.08)}

/* chat */
#chatlog{display:flex;flex-direction:column;gap:10px;padding-bottom:8px;min-height:48vh}
.msg{max-width:85%;padding:12px 15px;border-radius:19px;font-size:14.5px;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px;box-shadow:0 2px 10px rgba(58,36,64,.05)}
.msg.ai.thinking{color:var(--ink-soft);font-style:italic}
.msg .who{display:block;font-size:10.5px;opacity:.65;font-weight:700;letter-spacing:.06em;margin-bottom:3px;text-transform:uppercase}
.chatbox{position:fixed;bottom:calc(66px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:100%;max-width:520px;padding:8px 14px;display:flex;gap:8px;background:linear-gradient(transparent,var(--bg) 35%)}
.chatbox textarea{flex:1;border:1px solid var(--line);border-radius:22px;padding:12px 16px;resize:none;background:var(--card);max-height:110px;box-shadow:0 4px 16px rgba(58,36,64,.07)}
.sendbtn{width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;flex-shrink:0;box-shadow:var(--glowshadow);display:flex;align-items:center;justify-content:center}
.suggest{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.suggest::-webkit-scrollbar{display:none}
.suggest button{flex-shrink:0;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:12.5px;color:var(--ink-soft);font-weight:550}

/* lists */
.doc{display:flex;gap:12px;align-items:flex-start}
.doc .dic{width:42px;height:42px;border-radius:13px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.rem{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rem:last-child{border-bottom:none}
.rem .ric{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;background:var(--bg2);flex-shrink:0}
.rem .rtxt{flex:1}
.rem .rtxt b{display:block;font-size:14.5px}
.rem .rtxt span{font-size:12.5px;color:var(--ink-soft)}
.del{color:#C07; opacity:.55;font-size:16px;padding:6px}
.bagitem{display:flex;align-items:center;gap:11px;padding:9px 0;font-size:14.5px;border-bottom:1px solid var(--line)}
.bagitem:last-child{border:none}
.bagitem input{width:21px;height:21px;accent-color:var(--accent)}
.bagitem.done span{opacity:.45;text-decoration:line-through}
.lovenote{background:linear-gradient(135deg,var(--bg2),var(--card));border:1px solid var(--line);border-radius:16px;padding:12px 15px;margin-bottom:9px;font-size:14.5px}
.lovenote .from{font-size:11px;color:var(--accent-deep);font-weight:700;letter-spacing:.05em}

/* overlays / sheets */
.overlay{position:fixed;inset:0;background:rgba(45,26,52,.5);backdrop-filter:blur(3px);z-index:100;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:10px 20px calc(26px + env(safe-area-inset-bottom));max-height:88dvh;overflow-y:auto;animation:slideup .28s ease}
.sheet::before{content:"";display:block;width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
@keyframes slideup{from{transform:translateY(50px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin-bottom:13px;font-size:22px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:650;margin-bottom:6px;color:var(--ink-soft)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card)}
.banner{position:fixed;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:16px;padding:12px 18px;font-size:13.5px;z-index:300;box-shadow:0 10px 34px rgba(0,0,0,.35);max-width:90%;display:none}
.banner.show{display:block;animation:slideup .3s ease}
.redflag{background:#FBEFEF;border:1px solid #F0D2D2;border-radius:var(--radius);padding:15px 17px;margin-bottom:13px}
.redflag h3{color:#A8434F;font-size:14.5px;margin-bottom:5px}
.redflag li{font-size:13px;margin-left:17px;color:#6E3A42;padding:1px 0}
.spin{display:inline-block;width:15px;height:15px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:rot .7s linear infinite;vertical-align:-3px}
@keyframes rot{to{transform:rotate(360deg)}}
.greet{margin:2px 0 13px}
.greet h2{font-size:25px;line-height:1.2}
.greet p{color:var(--ink-soft);font-size:13.5px;margin-top:3px;font-style:italic;font-family:'Fraunces',serif}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#C9B7D1;display:inline-block;margin-right:4px}
.sync-dot.on{background:#6FBF8B;box-shadow:0 0 6px #6FBF8B}
.weekslider{width:100%;appearance:none;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--bg2),var(--accent));outline:none;margin:12px 0 4px}
.weekslider::-webkit-slider-thumb{appearance:none;width:27px;height:27px;border-radius:50%;background:var(--card);border:3px solid var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.22)}
.ctimer{text-align:center}
.ctimer .big{font-family:'Fraunces',serif;font-size:46px;line-height:1.1}
.ctable{width:100%;font-size:13px;border-collapse:collapse;margin-top:10px}
.ctable td,.ctable th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:center}

/* onboarding */
#onboard{position:fixed;inset:0;background:radial-gradient(circle at 50% 28%,#FBE6DE,#F0C5C2 55%,#D6A0AE);z-index:400;display:none;flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center;overflow-y:auto}
#onboard h1{font-size:46px;color:#5E2E44;margin-bottom:4px}
#onboard .tag{color:#6E4258;max-width:300px;margin:0 auto 20px;font-size:14.5px}
#onboard .panel{background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-radius:24px;padding:22px;width:100%;max-width:370px;text-align:left}
.rolebtns{display:flex;gap:10px;margin-bottom:14px}
.rolebtn{flex:1;border:2px solid var(--line);border-radius:17px;padding:14px 8px;text-align:center;font-weight:650;font-size:13.5px;background:#fff}
.rolebtn .big{font-size:27px;display:block;margin-bottom:3px}
.rolebtn.sel{border-color:#DE6E7C;background:#FDF1EE}
</style>
</head>
<body class="t2">
<div id="app">
  <div class="topbar">
    <div class="brand"><span class="moon"></span>Nila</div>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="muted" style="font-size:11px" id="syncState"></span>
      <div class="weekpill" id="pillWeek">Week —</div>
      <button class="iconbtn" onclick="openSettings()"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
  </div>
  <div class="journey"><i id="journeyBar" style="width:0%"></i></div>

  <div class="screen active" id="scr-today"></div>
  <div class="screen" id="scr-baby"></div>
  <div class="screen" id="scr-chat">
    <div class="suggest" id="suggest"></div>
    <div id="chatlog"></div>
  </div>
  <div class="screen" id="scr-care"></div>
  <div class="screen" id="scr-records"></div>

  <div class="chatbox" id="chatbox" style="display:none">
    <textarea id="chatinput" rows="1" placeholder="Ask Nila anything…"></textarea>
    <button class="sendbtn" onclick="sendChat()"><svg class="ic" viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
  </div>

  <div class="tabbar">
    <button class="tab active" data-s="today"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="13" r="4"/><path d="M12 3v2M5.6 6.6l1.4 1.4M3 13h2M19 13h2M17 8l1.4-1.4M4 20h16"/></svg>Today</button>
    <button class="tab" data-s="baby"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="10.2" cy="9.5" r="3.4"/><path d="M13.5 11.5c1.8.8 2.4 3 1.3 4.7-1 1.6-3.2 2-4.8 1"/></svg>Baby</button>
    <button class="tab" data-s="chat"><svg class="ic" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-9 8.36 8.5 8.5 0 0 1-3.4-.76L3 21l1.9-5.6A8.38 8.38 0 0 1 4.5 11.5a8.5 8.5 0 0 1 17 0z"/></svg>Chat</button>
    <button class="tab" data-s="care"><svg class="ic" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/><path d="M7 12h3l1.5-3 2 5L15 12h2"/></svg>Care</button>
    <button class="tab" data-s="records"><svg class="ic" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h4"/></svg>Records</button>
  </div>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="banner" id="banner"></div>
<input type="file" id="fileinput" accept=".pdf,image/*" style="display:none" multiple>

<div id="onboard">
  <h1>Nila</h1>
  <p class="tag">A moonlit companion for the most beautiful journey of your lives — built for two.</p>
  <div class="panel">
    <div class="rolebtns">
      <button class="rolebtn sel" id="role-mom" onclick="obRole('mom')"><span class="big">🤰</span>I'm the mama</button>
      <button class="rolebtn" id="role-partner" onclick="obRole('partner')"><span class="big">🫶</span>I'm the partner</button>
    </div>

let pushTimer=null,sse=null;
function syncOn(){return !!(S.fbUrl&&S.code);}
function fbPath(){return S.fbUrl.replace(/\/+$/,"")+"/families/"+encodeURIComponent(S.code.trim().toLowerCase())+".json";}
function setSyncDot(on){const el=document.getElementById("syncState");el.innerHTML=syncOn()?`<span class="sync-dot ${on?"on":""}"></span>${on?"synced":"offline"}`:"";}
function sharedState(){const o={...S};LOCAL_KEYS.forEach(k=>delete o[k]);o.writer=device;return o;}
function schedulePush(){if(!syncOn())return;clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>fetch(fbPath(),{method:"PUT",body:JSON.stringify(sharedState())})
    .then(r=>setSyncDot(r.ok)).catch(()=>setSyncDot(false)),900);}
function normalizeRemote(d){
  ["memory","docs","reminders","chat","pchat","notes","contractions"].forEach(k=>d[k]=d[k]||[]);
  ["kicks","water","mood","bag"].forEach(k=>d[k]=d[k]||{});
  ["name","partnerName","lmp","apiKey"].forEach(k=>{if(d[k]==null)d[k]=S[k];});
  return d;}
function mergeRemote(d){
  if(!d||d.writer===device)return; if((d.updated||0)<=(S.updated||0))return;
  d=normalizeRemote(d); LOCAL_KEYS.forEach(k=>delete d[k]); delete d.writer;
  Object.assign(S,d); persist(); applyTheme(); rerender();
}
function startSync(){
  if(!syncOn()){setSyncDot(false);return;}
  fetch(fbPath()).then(r=>r.json()).then(d=>{
    if(d&&(d.updated||0)>(S.updated||0)) mergeRemote(d); else schedulePush();
    try{ if(sse)sse.close();
      sse=new EventSource(fbPath());
      sse.addEventListener("put",e=>{try{const m=JSON.parse(e.data);
        if(m&&m.path==="/") mergeRemote(m.data);
        else fetch(fbPath()).then(r=>r.json()).then(d2=>mergeRemote(d2));}catch(_){}});
      sse.onopen=()=>setSyncDot(true);
      sse.onerror=()=>setSyncDot(false);
    }catch(e){setSyncDot(false);}
  }).catch(()=>setSyncDot(false));
}

const wombAnims={};
function brand(svg,id){return svg.split('id="shade"').join('id="shade-'+id+'"').split('url(#shade)').join('url(#shade-'+id+')').split('id="soft2"').join('id="soft2-'+id+'"').split('url(#soft2)').join('url(#soft2-'+id+')').split('id="skin"').join('id="skin-'+id+'"').split('id="glow"').join('id="glow-'+id+'"').split('id="soft"').join('id="soft-'+id+'"').split('url(#skin)').join('url(#skin-'+id+')').split('url(#glow)').join('url(#glow-'+id+')').split('url(#soft)').join('url(#soft-'+id+')');}
function wombHTML(id,h){return `<div class="womb" style="height:${h}px" id="${id}">
  <canvas></canvas>
  <div class="babywrap"><div class="hb" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center">
    <svg class="baby" viewBox="0 0 200 200">${brand(SKIN,id)}<g class="stg"></g></svg></div></div>
  <div class="orb-week"></div><div class="orb-caption"></div><div class="factbubble"></div></div>`;}
function setBabyWeek(id,week){
  const el=document.getElementById(id); if(!el)return;
  const st=BABY_STAGES.find(s=>clamp(week,4,40)<=s.max);
  const t=(clamp(week,4,40)-4)/36, sc=(0.52+0.48*Math.pow(t,0.85)).toFixed(3);
  const g=el.querySelector(".stg");
  const html=`<g transform="translate(100 100) scale(${sc}) translate(-100 -100)">${brand(st.svg,id)}</g>`;
  if(g.dataset.stage!==String(st.max)){
    g.style.transition="opacity .22s"; g.style.opacity=0;
    setTimeout(()=>{g.innerHTML=html;g.dataset.stage=st.max;g.style.opacity=1;},220);
  }else g.innerHTML=html;
  el.querySelector(".orb-week").textContent="Week "+week;
}
function mountWomb(id,weekFn,caption){
  const el=document.getElementById(id); if(!el)return;
  el.querySelector(".orb-caption").textContent=caption;
  setBabyWeek(id,weekFn());
  // ambient canvas: bokeh + light rays (+ stars & moon in trimester 3)
  const cv=el.querySelector("canvas"),ctx=cv.getContext("2d");
  const P=[...Array(22)].map((_,i)=>({x:Math.random(),y:Math.random(),r:1.2+Math.random()*2.6,s:.05+Math.random()*.12,o:.08+Math.random()*.16,ph:Math.random()*7}));
  let t0=performance.now();
  cancelAnimationFrame(wombAnims[id]);
  const loop=(now)=>{
    if(!document.body.contains(cv)){return;}
    const W=el.clientWidth,H=el.clientHeight,dpr=window.devicePixelRatio||1;
    if(cv.width!==W*dpr){cv.width=W*dpr;cv.height=H*dpr;}
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
    const tm=(now-t0)/1000, night=document.body.classList.contains("t3");
    // light rays
    ctx.save();ctx.globalAlpha=night?.06:.10;ctx.fillStyle="#FFFFFF";
    for(let i=0;i<3;i++){const x=W*(0.25+0.25*i)+Math.sin(tm*.3+i)*14;
      ctx.beginPath();ctx.moveTo(x-26,0);ctx.lineTo(x+26,0);ctx.lineTo(x+72,H);ctx.lineTo(x-72,H);ctx.fill();}
    ctx.restore();
    // bokeh / stars
    P.forEach(p=>{const y=(p.y+tm*p.s*.04)%1.1;
      ctx.fillStyle=night?`rgba(244,232,255,${p.o+0.1*Math.sin(tm*2+p.ph)})`:`rgba(255,255,255,${p.o+0.08*Math.sin(tm+p.ph)})`;
      ctx.beginPath();ctx.arc(p.x*W,(1.05-y)*H,night?p.r*.8:p.r,0,7);ctx.fill();});
    if(night){ // little golden moon
      const mx=W-44,my=40;
      const g2=ctx.createRadialGradient(mx,my,2,mx,my,26);
      g2.addColorStop(0,"rgba(255,226,150,.95)");g2.addColorStop(.5,"rgba(255,214,120,.35)");g2.addColorStop(1,"rgba(255,214,120,0)");
      ctx.fillStyle=g2;ctx.beginPath();ctx.arc(mx,my,26,0,7);ctx.fill();
      ctx.fillStyle="#FFE7A8";ctx.beginPath();ctx.arc(mx,my,9,0,7);ctx.fill();}
    wombAnims[id]=requestAnimationFrame(loop);
  };
  wombAnims[id]=requestAnimationFrame(loop);
  // tap → wonder fact ; drag → gentle parallax
  const fact=el.querySelector(".factbubble"),svg=el.querySelector("svg.baby");
  el.onclick=()=>{const w=weekFn();fact.textContent=FACTS[Math.floor(Math.random()*FACTS.length)](w);
    fact.classList.add("show");clearTimeout(fact._t);fact._t=setTimeout(()=>fact.classList.remove("show"),4200);};
  let dragX=null;
  el.addEventListener("pointerdown",e=>dragX=e.clientX);
  el.addEventListener("pointermove",e=>{if(dragX==null)return;const dx=clamp((e.clientX-dragX)/14,-9,9);
    svg.style.transform=`rotate(${dx}deg) translateX(${dx*1.5}px)`;});
  ["pointerup","pointerleave"].forEach(ev=>el.addEventListener(ev,()=>{dragX=null;svg.style.transform="";}));
}

function tapTile(ev,kind){
  const tk=todayKey(),max=kind==="water"?8:99;
  S[kind][tk]=Math.min(max,(S[kind][tk]||0)+1); save();
  const r=document.createElement("span");r.className="ripple";
  const b=ev.currentTarget.getBoundingClientRect();
  r.style.cssText=`width:60px;height:60px;left:${ev.clientX-b.left-30}px;top:${ev.clientY-b.top-30}px`;
  ev.currentTarget.appendChild(r);setTimeout(()=>r.remove(),520);
  if(kind==="water"&&S.water[tk]===8)banner("8 glasses — beautifully hydrated 💙");
  if(kind==="kicks"&&S.kicks[tk]===10)banner("10 kicks felt — baby is doing wonderfully 🥰");
  setTimeout(rerender,80);
}

/* ===== AI PHOTOREAL PORTRAITS ===== */
const portMem={};
function portraitGet(w){if(portMem[w])return portMem[w];try{return localStorage.getItem("nilap_"+w);}catch(e){return null;}}
function portraitSave(w,data){portMem[w]=data;
  try{Object.keys(localStorage).filter(k=>k.startsWith("nilap_")&&k!=="nilap_"+w).slice(0,-1).forEach(k=>localStorage.removeItem(k));
      localStorage.setItem("nilap_"+w,data);}catch(e){}}
function refreshPortrait(){
  const el=document.getElementById("orbBaby");if(!el)return;
  let img=el.querySelector(".portrait"),tg=el.querySelector(".porttoggle");
  const data=portraitGet(viewWeek);
  if(data&&!el.dataset.illus){
    if(!img){img=document.createElement("img");img.className="portrait";el.appendChild(img);}
    img.src=data;
    if(!tg){tg=document.createElement("button");tg.className="porttoggle";tg.textContent="🎨 illustration";
      tg.onclick=e=>{e.stopPropagation();el.dataset.illus="1";refreshPortrait();};el.appendChild(tg);}
    tg.style.display="block";
  }else{
    if(img)img.remove();
    if(tg){if(data){tg.textContent="✨ photo";tg.onclick=e=>{e.stopPropagation();delete el.dataset.illus;refreshPortrait();};}
      else tg.style.display="none";}
  }
}
async function genPortrait(){
  if(!S.apiKey){openSettings();banner("Add your OpenAI API key first 🔑");return;}
  const btn=document.getElementById("aiBtn"),w=viewWeek;
  btn.disabled=true;btn.innerHTML='<span class="spin"></span> Painting week '+w+'… (~20s)';
  const prompt=`A serene, photorealistic artistic 3D render of a healthy human fetus at pregnancy week ${w}, gently curled and floating inside the womb, eyes peacefully closed, soft warm amber-rose lighting, translucent amniotic glow, medically accurate size and proportions for week ${w}, tender and beautiful, high detail, no text`;
  async function tryModel(body){
    const r=await fetch("https://api.openai.com/v1/images/generations",{method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+S.apiKey},body:JSON.stringify(body)});
    if(!r.ok)throw new Error((await r.text()).slice(0,180));
    return (await r.json()).data[0];
  }
  try{
    let d;
    try{d=await tryModel({model:"gpt-image-1",prompt,size:"1024x1024",quality:"medium"});}
    catch(e){d=await tryModel({model:"dall-e-3",prompt,size:"1024x1024",response_format:"b64_json"});}
    const src=d.b64_json?("data:image/png;base64,"+d.b64_json):d.url;
    portraitSave(w,src);
    const el=document.getElementById("orbBaby");if(el)delete el.dataset.illus;
    refreshPortrait();banner("Week "+w+" portrait ready ✨");
  }catch(e){banner("Couldn't paint it ("+String(e.message).slice(0,90)+")",6000);}
  btn.disabled=false;btn.innerHTML='✨ AI photo-real portrait — week <span id="aiWk">'+viewWeek+'</span>';
}

/* ============ AI CORE ============ */
function systemPrompt(){
  const p=pregInfo();
  const mem=S.memory.length?S.memory.map((m,i)=>`[${i+1}] ${m}`).join("\n"):"(no medical records uploaded yet)";
  const base=`Pregnancy context: ${escapeName(S.role==="mom"?S.name:S.partnerName)||"the mother"} is in week ${p.week} (trimester ${p.trimester}), LMP ${S.lmp}, due ${p.due.toDateString()} (${p.daysLeft} days to go). This week: ${WEEKS[p.dataWeek].baby}
MEDICAL MEMORY from her uploaded reports (ground truth, reference naturally):
${mem}
SAFETY RULES: Never diagnose or change medication. For bleeding, severe pain, severe headache/vision changes, fever, fluid leaking, or reduced movements: say clearly and kindly to contact the doctor or hospital NOW. If unsure, say so and suggest asking the obstetrician. Indian & Kerala-friendly food advice welcome (ragi, moru, dates, muringa leaves...). Be concise (2-6 short sentences), warm, high positive energy, light emojis.`;
  if(S.role==="partner") return `You are Nila, a warm pregnancy companion. You are talking to ${escapeName(S.name)||"the partner"}, the baby's father/partner. Help him support ${escapeName(S.partnerName)||"his wife"} — practical, loving, specific. ${base}`;
  return `You are Nila, ${escapeName(S.name)||"a wonderful mother-to-be"}'s personal pregnancy companion: best friend + doctor-informed guide + dietician + gentle cheerleader. ${base}`;
}
function escapeName(s){return String(s||"").replace(/[<>&]/g,"");}
async function callAI(messages,model){
  if(!S.apiKey)throw new Error("nokey");
  const r=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+S.apiKey},
    body:JSON.stringify({model:model||"gpt-4o-mini",max_tokens:900,messages})});
  if(!r.ok){const e=await r.text();throw new Error("API "+r.status+": "+e.slice(0,160));}
  return (await r.json()).choices[0].message.content;
}

/* ============ CHAT (shared view, two threads) ============ */
function myThread(){return S.role==="partner"?S.pchat:S.chat;}
function renderChat(){
  const p=pregInfo();
  if(!S.chat.length&&S.role==="mom"){
    S.chat.push({role:"assistant",content:`Hi ${S.name||"there"}! 🌙 I'm Nila — I know your week-${p.week} little one and everything in your reports. Ask me anything: food, symptoms, feelings, scans… I'm right here 💗`,t:Date.now()});persist();}
  if(!S.pchat.length&&S.role==="partner"){
    S.pchat.push({role:"assistant",content:`Hi ${S.name||"there"}! 🫶 I'm Nila. I watch over ${S.partnerName||"her"} too — ask me how to support her, what her reports mean, or what's coming next.`,t:Date.now()});persist();}
  const merged=[...S.chat.map(m=>({...m,th:"mom"})),...S.pchat.map(m=>({...m,th:"partner"}))].sort((a,b)=>(a.t||0)-(b.t||0));
  const herName=S.role==="partner"?(S.partnerName||"Her"):"You";
  document.getElementById("chatlog").innerHTML=merged.map(m=>{
    const mine=m.th===S.role;
    const who=m.role==="assistant"?(m.th==="partner"?"Nila → "+(S.role==="partner"?"you":S.partnerName||"partner"):"Nila"):(mine?"You":(m.th==="mom"?escapeHTML(S.partnerName?herName:"Her"):escapeHTML(S.partnerName||"Partner")));
    return `<div class="msg ${m.role==="user"?"user":"ai"}" style="${m.role==="user"&&!mine?"opacity:.78":""}"><span class="who">${m.role==="user"&&mine?"":who}</span>${escapeHTML(m.content)}</div>`;}).join("");
  document.getElementById("suggest").innerHTML=(S.role==="partner"?SUGG_PARTNER:SUGG_MOM)
    .map(s=>`<button onclick="quickAsk(this.textContent)">${s}</button>`).join("");
  window.scrollTo(0,document.body.scrollHeight);
}
function quickAsk(q){document.getElementById("chatinput").value=q;sendChat();}
async function sendChat(){
  const inp=document.getElementById("chatinput"),text=inp.value.trim();if(!text)return;
  if(!S.apiKey){openSettings();banner("Add your OpenAI API key first 🔑");return;}
  inp.value="";
  myThread().push({role:"user",content:text,t:Date.now()});save();renderChat();
  const log=document.getElementById("chatlog");
  const tk=document.createElement("div");tk.className="msg ai thinking";tk.textContent="Nila is thinking…";log.appendChild(tk);
  window.scrollTo(0,document.body.scrollHeight);
  try{
    const hist=myThread().slice(-16).map(m=>({role:m.role,content:m.content}));
    const reply=await callAI([{role:"system",content:systemPrompt()},...hist]);
    myThread().push({role:"assistant",content:reply,t:Date.now()});
  }catch(e){
    myThread().push({role:"assistant",content:e.message==="nokey"?"Please add your OpenAI key in settings ⚙️":"I couldn't reach my brain just now ("+e.message+"). Check internet or the API key and try again 💛",t:Date.now()});
  }
  save();renderChat();
}
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&document.activeElement.id==="chatinput"){e.preventDefault();sendChat();}});

/* ============ RECORDS ============ */
function renderRecords(){
  document.getElementById("scr-records").innerHTML=`
  <div class="greet"><h2>Medical records</h2><p style="font-style:normal">Every scan and report, past and future — Nila reads, understands, and remembers.</p></div>
  <button class="btn full" onclick="document.getElementById('fileinput').click()">📤 Upload report (PDF or photo)</button>
  <div style="height:13px"></div>
  ${S.docs.length?S.docs.slice().reverse().map(d=>`
    <div class="card doc"><div class="dic">${d.icon||"📄"}</div>
      <div style="flex:1"><b>${escapeHTML(d.title)}</b><div class="muted">${escapeHTML(d.date||"")} · ${escapeHTML(d.type||"report")}</div>
      <p style="font-size:13.5px;margin-top:6px">${escapeHTML(d.summary)}</p>
      ${(d.flags||[]).map(f=>`<div class="chip warn">${escapeHTML(f)}</div>`).join("")}
      ${(d.meds||[]).map(m=>`<div class="chip good">💊 ${escapeHTML(m)}</div>`).join("")}</div>
      ${S.role==="mom"?`<button class="del" onclick="delDoc('${d.id}')">✕</button>`:""}</div>`).join("")
   :`<div class="card" style="text-align:center;color:var(--ink-soft)">No records yet.<br>Start with the latest scan — Nila will read it and remember everything 🌸</div>`}`;
}
function delDoc(id){if(!confirm("Remove this record and its memory?"))return;
  const d=S.docs.find(x=>String(x.id)===String(id));S.docs=S.docs.filter(x=>String(x.id)!==String(id));
  if(d&&d.memIdx!=null)S.memory[d.memIdx]="(removed)";save();renderRecords();}
document.getElementById("fileinput").onchange=async e=>{
  if(!S.apiKey){openSettings();banner("Add your OpenAI API key first 🔑");return;}
  for(const f of e.target.files)await analyzeFile(f);e.target.value="";};
function fileToB64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});}
async function analyzeFile(f){
  banner("Reading "+f.name+"… 🔍",60000);
  try{
    const b64=await fileToB64(f),isPDF=f.type==="application/pdf";
    const content=[isPDF?{type:"file",file:{filename:f.name,file_data:b64}}:{type:"image_url",image_url:{url:b64}},
      {type:"text",text:`Medical document from a pregnancy (LMP ${S.lmp}, currently week ${pregInfo().week}). Respond ONLY with raw JSON, no markdown fences: {"title":"short title","date":"document date if visible","type":"scan|blood test|prescription|other","summary":"3-4 warm, simple, positively-framed sentences explaining what this means for the mother","flags":["risks/abnormal values, short"],"meds":["medicine + dose + timing"],"nextSteps":["recommended scans/tests with timing"],"memoryNote":"one dense paragraph with ALL medically important details (values, dates, findings, risks, meds) for future reference"}`}];
    const raw=await callAI([{role:"user",content}],"gpt-4o");
    const j=JSON.parse(raw.replace(/```json|```/g,"").trim());
    const memIdx=S.memory.push(`${j.date||""} ${j.title}: ${j.memoryNote}`)-1;
    S.docs.push({id:String(Date.now()),title:j.title,date:j.date,type:j.type,summary:j.summary,flags:j.flags||[],meds:j.meds||[],icon:j.type==="scan"?"🩻":j.type==="prescription"?"💊":"🧪",memIdx});
    save();renderRecords();banner("Understood and remembered 💗");
    if((j.meds&&j.meds.length)||(j.nextSteps&&j.nextSteps.length))offerReminders(j);
  }catch(err){banner("Couldn't read that file ("+err.message.slice(0,80)+"). Try a clear photo or PDF.",5000);}
}
function offerReminders(j){
  const items=[...(j.meds||[]).map(m=>({title:"💊 "+m,type:"medicine",time:"09:00"})),
               ...(j.nextSteps||[]).map(n=>({title:"🩺 "+n,type:"appointment",time:"10:00"}))];
  window._pend=items;
  openSheetHTML(`<h2>Add these to Care? ⏰</h2><p class="muted" style="margin-bottom:12px">Found in the report — they'll appear on both phones.</p>
  ${items.map((it,i)=>`<label style="display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)"><input type="checkbox" checked data-i="${i}" class="remchk" style="width:20px;height:20px;accent-color:var(--accent)"> <span style="font-size:14px">${escapeHTML(it.title)}</span></label>`).join("")}
  <div style="height:14px"></div><button class="btn full" onclick="confirmReminders()">Add selected</button>`);
}
function confirmReminders(){
  document.querySelectorAll(".remchk").forEach(c=>{if(c.checked){const it=window._pend[+c.dataset.i];
    S.reminders.push({id:String(Date.now()+Math.random()),title:it.title,type:it.type,time:it.time,daily:it.type==="medicine"});}});
  save();closeSheet();banner("Added to Care ⏰");
}

/* ============ CARE: reminders + bag + contractions ============ */
function bagCardHTML(){
  const total=BAG_ITEMS.length,done=BAG_ITEMS.filter(b=>S.bag[b]).length;
  return `<div class="card" style="display:flex;align-items:center;gap:12px" onclick="show('care')"><div style="font-size:22px">🧳</div>
    <div style="flex:1"><b>Hospital bag · ${done}/${total} packed</b>
    <div class="journey" style="margin:6px 0 0;height:5px"><i style="width:${done/total*100}%"></i></div></div>
    <div style="color:var(--accent)">→</div></div>`;
}
function renderCare(){
  const p=pregInfo(),icons={medicine:"💊",appointment:"🩺",diet:"🥗",water:"💧",other:"⏰"};
  document.getElementById("scr-care").innerHTML=`
  <div class="greet"><h2>Care schedule</h2><p style="font-style:normal">Medicines, scans, rest — gentle watch, on both phones.</p></div>
  <button class="btn full" onclick="newReminderSheet()">＋ New reminder</button>
  <div style="height:13px"></div>
  <div class="card">
  ${S.reminders.length?S.reminders.slice().sort((a,b)=>a.time.localeCompare(b.time)).map(r=>`
    <div class="rem"><div class="ric">${icons[r.type]||"⏰"}</div>
      <div class="rtxt"><b>${escapeHTML(r.title)}</b><span>${r.time}${r.daily?" · every day":""}</span></div>
      <button class="del" onclick="delRem('${r.id}')">✕</button></div>`).join("")
   :`<p class="muted" style="text-align:center">Nothing yet. Add iron & calcium timings, scan dates — or let report uploads suggest them.</p>`}
  </div>
  ${p.week>=32?`<div class="card"><div class="eyebrow">🧳 Hospital bag</div>
    ${BAG_ITEMS.map(b=>`<label class="bagitem ${S.bag[b]?"done":""}"><input type="checkbox" ${S.bag[b]?"checked":""} onchange="S.bag['${b.replace(/'/g,"\\'")}']=this.checked;save();renderCare()"><span>${b}</span></label>`).join("")}</div>`:""}
  ${p.week>=36?contractionHTML():""}
  <button class="btn ghost full" onclick="askNotif()">🔔 Enable notifications on this device</button>`;
}
let cStart=null;
function contractionHTML(){
  const rows=S.contractions.slice(-6).reverse();
  return `<div class="card ctimer"><div class="eyebrow">⏱️ Contraction timer</div>
  <div class="big" id="cClock">${cStart?"…":"0:00"}</div>
  <button class="btn" style="margin:10px 0" onclick="toggleContraction()" id="cBtn">${cStart?"Contraction ended":"Contraction started"}</button>
  ${rows.length?`<table class="ctable"><tr><th>Time</th><th>Lasted</th><th>Gap</th></tr>
    ${rows.map(c=>`<tr><td>${new Date(c.start).toTimeString().slice(0,5)}</td><td>${Math.round(c.dur)}s</td><td>${c.gap?Math.round(c.gap/60)+"m":"—"}</td></tr>`).join("")}</table>`:""}
  <p class="muted" style="margin-top:9px;font-size:12px">5-1-1 rule: contractions every 5 min, lasting 1 min, for 1 hour → time for the hospital.</p></div>`;
}
let cTick=null;
function toggleContraction(){
  if(!cStart){cStart=Date.now();
    cTick=setInterval(()=>{const s=Math.floor((Date.now()-cStart)/1000);
      const el=document.getElementById("cClock");if(el)el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");},500);
    document.getElementById("cBtn").textContent="Contraction ended";
  }else{
    clearInterval(cTick);
    const prev=S.contractions[S.contractions.length-1];
    S.contractions.push({start:cStart,dur:(Date.now()-cStart)/1000,gap:prev?(cStart-prev.start)/1000:null});
    cStart=null;save();renderCare();check511();
  }
}
function check511(){
  const c=S.contractions.slice(-12),hour=c.filter(x=>Date.now()-x.start<3600000);
  if(hour.length>=10&&hour.every(x=>x.dur>=45&&(x.gap==null||x.gap<=360)))
    banner("⚠️ 5-1-1 pattern — call your doctor and head to the hospital. You've got this 💪",10000);
}
function newReminderSheet(){
  openSheetHTML(`<h2>New reminder</h2>
  <div class="field"><label>What</label><input id="nr-t" placeholder="e.g., Iron tablet after lunch"></div>
  <div class="field"><label>Type</label><select id="nr-y"><option value="medicine">Medicine 💊</option><option value="appointment">Scan / appointment 🩺</option><option value="diet">Food / diet 🥗</option><option value="water">Water 💧</option><option value="other">Other</option></select></div>
  <div class="field"><label>Time</label><input id="nr-h" type="time" value="09:00"></div>
  <div class="field"><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="nr-d" checked style="width:19px;height:19px;accent-color:var(--accent)"> Repeat every day</label></div>
  <button class="btn full" onclick="addRem()">Add ⏰</button>`);
}
function addRem(){const t=document.getElementById("nr-t").value.trim();if(!t)return;
  S.reminders.push({id:String(Date.now()),title:t,type:document.getElementById("nr-y").value,time:document.getElementById("nr-h").value,daily:document.getElementById("nr-d").checked});
  save();closeSheet();renderCare();}
function delRem(id){S.reminders=S.reminders.filter(r=>String(r.id)!==String(id));save();renderCare();}
function askNotif(){if(!("Notification"in window)){banner("This device doesn't support web notifications — in-app reminders still work 💛");return;}
  Notification.requestPermission().then(p=>banner(p==="granted"?"Notifications on 🔔":"In-app reminders will still work 💛"));}
let lastTick="";
setInterval(()=>{const hm=new Date().toTimeString().slice(0,5);if(hm===lastTick)return;lastTick=hm;
  S.reminders.forEach(r=>{if(r.time===hm){banner("⏰ "+r.title,8000);
    if(window.Notification&&Notification.permission==="granted")try{new Notification("Nila 🌙",{body:r.title});}catch(e){}}});},20000);

/* ============ SHEETS / SETTINGS / ONBOARDING / INIT ============ */
function openSheetHTML(html){document.getElementById("sheet").innerHTML=html;document.getElementById("overlay").classList.add("open");}
function closeSheet(){document.getElementById("overlay").classList.remove("open");}
document.getElementById("overlay").onclick=e=>{if(e.target.id==="overlay")closeSheet();};
function openSettings(){
  openSheetHTML(`<h2>Settings</h2>
  <div class="field"><label>Your name</label><input id="st-name" value="${escapeHTML(S.name)}"></div>
  <div class="field"><label>${S.role==="mom"?"Partner's name":"Her name"}</label><input id="st-pname" value="${escapeHTML(S.partnerName)}"></div>
  <div class="field"><label>LMP date</label><input id="st-lmp" type="date" value="${S.lmp}"></div>
  <div class="field"><label>OpenAI API key</label><input id="st-key" type="password" value="${escapeHTML(S.apiKey)}"></div>
  <div class="field"><label>Firebase database URL (together mode)</label><input id="st-fb" value="${escapeHTML(S.fbUrl)}" placeholder="https://xxxx-default-rtdb.firebaseio.com"></div>
  <div class="field"><label>Couple code</label><input id="st-code" value="${escapeHTML(S.code)}"></div>
  <div class="field"><label>I am the…</label><select id="st-role"><option value="mom" ${S.role==="mom"?"selected":""}>Mama 🤰</option><option value="partner" ${S.role==="partner"?"selected":""}>Partner 🫶</option></select></div>
  <button class="btn full" onclick="saveSettings()">Save</button>
  <div style="height:10px"></div>
  <button class="btn ghost full" onclick="if(confirm('Clear chat history on this profile?')){(S.role==='partner'?S.pchat:S.chat).length=0;save();closeSheet();rerender();}">Clear my chat history</button>
  <p class="muted" style="margin-top:12px;font-size:11.5px;text-align:center">Data lives on your phones and your own private Firebase. No one else.</p>`);
}
function saveSettings(){
  S.name=document.getElementById("st-name").value.trim();
  S.partnerName=document.getElementById("st-pname").value.trim();
  S.lmp=document.getElementById("st-lmp").value||S.lmp;
  S.apiKey=document.getElementById("st-key").value.trim();
  S.fbUrl=document.getElementById("st-fb").value.trim();
  S.code=document.getElementById("st-code").value.trim();
  S.role=document.getElementById("st-role").value;
  save();closeSheet();startSync();rerender();banner("Saved 💗");
}
let obSel="mom";
function obRole(r){obSel=r;document.getElementById("role-mom").classList.toggle("sel",r==="mom");document.getElementById("role-partner").classList.toggle("sel",r==="partner");}
function finishOnboarding(){
  S.role=obSel;
  S.name=document.getElementById("ob-name").value.trim();
  S.lmp=document.getElementById("ob-lmp").value||"2026-01-02";
  S.apiKey=document.getElementById("ob-key").value.trim();
  S.fbUrl=document.getElementById("ob-fb").value.trim();
  S.code=document.getElementById("ob-code").value.trim();
  S.done=true;save();
  document.getElementById("onboard").style.display="none";
  startSync();rerender();
  setTimeout(()=>banner(`Welcome, ${S.name||"lovely"} — week ${pregInfo().week} together begins 🌙`,4500),400);
}
if(!S.done)document.getElementById("onboard").style.display="flex";
applyTheme();startSync();rerender();
</script>
